let data=JSON.parse(document.getElementById('catalog-data').textContent),view='all',page=0,layout='cards',activeId=null,lastFocus=null;const PAGE=24,$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeURL=s=>{try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};let prefs={favorites:[],notes:{}};try{prefs={...prefs,...JSON.parse(localStorage.getItem('deployment-studio-prefs')||'{}')}}catch{};if(!Array.isArray(prefs.favorites))prefs.favorites=[];if(!prefs.notes||typeof prefs.notes!=='object')prefs.notes={};

const name=p=>p.displayName||p.name, get=id=>data.projects.find(p=>p.id===id), fav=p=>prefs.favorites.includes(p.id),date=s=>s?new Date(s).toLocaleDateString('zh-CN'):'';const titles={all:'全部项目',favorites:'我的常用',launch:'启动中心',duplicates:'版本与副本',workflows:'工作流回顾',coverage:'扫描记录'};
function init(){const cats=[...new Set(data.projects.map(p=>p.category||'开发工具'))].sort();$('category').innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('stat-projects').textContent=data.projects.length;$('stat-launch').textContent=data.projects.filter(p=>p.commands.length).length;$('stat-dups').textContent=data.duplicates.length;$('stat-flows').textContent=data.workflows.length;$('nav-total').textContent=data.projects.length;$('nav-launch').textContent=$('stat-launch').textContent;$('nav-dups').textContent=data.duplicates.length;$('nav-flows').textContent=data.workflows.length;render()}
function setView(v){view=v;page=0;$('search').value='';$('category').value='';render()}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('crumb').textContent=titles[view];$('section-title').textContent=titles[view];$('overview').classList.toggle('hidden',view!=='all');$('nav-fav').textContent=data.projects.filter(fav).length;const isProjects=['all','favorites','launch'].includes(view);document.querySelector('.filters').classList.toggle('hidden',!isProjects);$('results').className=isProjects?'grid'+(layout==='rows'?' list':''):'';const q=$('search').value.toLocaleLowerCase().trim(),cat=$('category').value;let items=data.projects.filter(p=>(view!=='favorites'||fav(p))&&(view!=='launch'||p.commands.length)&&(!cat||p.category===cat)&&(!q||JSON.stringify([name(p),p.path,p.repo,p.description,p.stack,p.commands,p.uses,prefs.notes[p.id]]).toLocaleLowerCase().includes(q)));const sort=$('sort').value;items.sort(sort==='name'?(a,b)=>name(a).localeCompare(name(b)):sort==='launch'?(a,b)=>b.commands.length-a.commands.length:(a,b)=>b.modified.localeCompare(a.modified));$('pagination').innerHTML='';
if(isProjects){$('result-count').textContent=items.length;page=Math.max(0,Math.min(page,Math.ceil(items.length/PAGE)-1));$('results').innerHTML=items.slice(page*PAGE,(page+1)*PAGE).map(p=>`<article class="card"><div class="card-top"><div class="icon">${esc(name(p).slice(0,2).toUpperCase())}</div><div><h3>${esc(name(p))}</h3><div class="kind">${esc(p.category||'开发工具')}</div></div><button class="star ${fav(p)?'on':''}" data-star="${esc(p.id)}" aria-label="${fav(p)?'取消常用':'设为常用'}">${fav(p)?'★':'☆'}</button></div><p class="desc">${esc(p.description)}</p><div class="tags"><span class="tag good">已获取</span>${p.stack.slice(0,2).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}${p.version?`<span class="tag">v${esc(p.version)}</span>`:''}</div><div class="card-bottom"><span>${p.commands.length?'▷ '+p.commands.length+' 个启动入口':'启动方式待补充'}</span><button data-open="${esc(p.id)}">${view==='launch'?'查看启动方式':'查看项目'} ↗</button></div></article>`).join('')||'<div class="empty"><strong>这里还没有项目</strong>试试其他关键词，或将项目设为常用。</div>';if(items.length>PAGE)$('pagination').innerHTML=`<button class="btn" id="prev" ${page===0?'disabled':''}>上一页</button><span>${page+1} / ${Math.ceil(items.length/PAGE)}</span><button class="btn" id="next" ${(page+1)*PAGE>=items.length?'disabled':''}>下一页</button>`;
}else if(view==='duplicates'){const gs=data.duplicates.filter(g=>!q||JSON.stringify([g,...g.ids.map(get)]).toLowerCase().includes(q));$('result-count').textContent=gs.length;$('results').innerHTML=gs.map(g=>`<section class="dup"><span class="tag">${esc(g.comparison)}</span><h3>${esc(g.name)}</h3><a href="${esc(safeURL(g.repo))}" target="_blank" rel="noopener">${esc(g.repo)}</a>${g.ids.map(id=>get(id)).filter(Boolean).map(p=>`<div class="dup-row"><div class="path">${esc(p.path)}</div><span class="tag">${esc(p.branch||'分支未知')}</span><code>${esc(p.commit.slice(0,8)||'—')}</code><span>${p.dirty?'有本地改动':'已跟踪文件无改动'}</span><button class="btn" data-open="${esc(p.id)}">查看</button></div>`).join('')}</section>`).join('')||'<div class="empty"><strong>没有匹配的重复仓库</strong>同一远端的不同目录会在这里并列；符号链接合并为一个项目。</div>';
}else if(view==='workflows'){const ws=data.workflows.filter(w=>!q||JSON.stringify(w).toLowerCase().includes(q));$('result-count').textContent=ws.length;$('results').innerHTML=ws.map(w=>`<section class="workflow"><span class="label">WORKFLOW / ${esc(w.status||'历史回顾')}</span><h3>${esc(w.title)}</h3><p class="muted">${esc(w.description)}</p><div class="flow">${w.steps.map((s,i)=>`<div class="step"><span class="step-num">0${i+1}</span><b>${esc(s.title)}</b><p>${esc(s.description)}</p>${s.ids.map(get).filter(Boolean).map(p=>`<button data-open="${esc(p.id)}">${esc(name(p))} ↗</button>`).join('')}</div>`).join('')}</div><p class="notice">${esc(w.evidence||'')}</p></section>`).join('')||'<div class="empty"><strong>暂无匹配工作流</strong>运行 skill 分析历史，再将工作流整理进 annotations 文件。</div>';
}else{$('result-count').textContent='';$('results').innerHTML=`<section class="coverage"><span class="label">LOCAL DISCOVERY</span><h3>本次扫描</h3><p>${esc(new Date(data.generatedAt).toLocaleString('zh-CN'))} · ${data.coverage.directories} 个目录 · 最大深度 ${data.coverage.maxDepth}</p><ul>${data.coverage.roots.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p>${data.coverage.errors.length} 项读取异常</p>${data.coverage.errors.length?`<details><summary>查看异常</summary><ul>${data.coverage.errors.map(e=>`<li>${esc(e.path)} — ${esc(e.error)}</li>`).join('')}</ul></details>`:''}</section><section class="coverage"><h3>如何更新清单</h3><p class="muted">在 Codex 中调用 deployment-history，或重新运行配套扫描器，然后打开新 HTML 或导入生成的 JSON。浏览器页面不会自行扫描电脑。</p><div class="refresh-help">使用 $deployment-history，重新扫描本地项目并更新工具工作室，整理启动方式、重复版本和工作流。</div><p class="notice">项目备注与常用状态保存在当前浏览器；导出 JSON 会一并保存。导入新扫描保留相同项目的备注。</p></section>`}
$('footnote').textContent=`扫描于 ${date(data.generatedAt)} · 本地数据，不自动联网 · 已获取包含源码、下载目录和应用包`}
function openProject(id){const p=get(id);if(!p)return;activeId=id;lastFocus=document.activeElement;$('drawer').innerHTML=`<button class="close" id="close" aria-label="关闭详情">×</button><span class="label">PROJECT / ${esc(p.category)}</span><h2>${esc(name(p))}</h2><p class="muted">${esc(p.description)}</p><div class="meta"><span class="tag good">已获取</span><span class="tag">${esc(p.runStatus)}</span>${p.stack.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>${p.repo?`<a href="${esc(safeURL(p.repo))}" target="_blank" rel="noopener">查看源码仓库 ↗</a>`:''}<h4>项目位置 <button class="btn" id="copy-path">复制路径</button></h4><div class="path">${esc(p.path)}</div>${p.aliases.length?'<p class="notice">兼容入口：'+p.aliases.map(esc).join('<br>')+'</p>':''}<h4>版本信息</h4><div class="path">版本：${esc(p.version||'未声明')}　分支：${esc(p.branch||'未记录')}<br>提交：${esc(p.commit||'非 Git 仓库或未取得提交')}<br>已跟踪文件：${p.commit?(p.dirty?'有本地修改':'无本地修改'):'未检查'}</div><h4>启动方式 <span class="muted">${p.commands.length} 个</span></h4>${p.commands.map((c,i)=>`<div class="command"><header>${esc(c.label)} · ${esc(c.kind)}<button data-copy-command="${i}">复制命令</button></header><pre>${esc(c.command)}</pre><p class="notice" style="padding:0 12px;margin:0 0 10px">来源：${esc(c.source)}</p></div>`).join('')||'<p class="muted">暂未发现启动入口，可在备注中记录。</p>'}<h4>后来用它做过什么</h4>${p.uses.length?'<ul>'+p.uses.map(s=>`<li>${esc(s)}</li>`).join('')+'</ul>':'<p class="muted">使用记录待补充</p>'}${p.evidence?`<p class="notice">${esc(p.evidence)}</p>`:''}<h4>我的备注</h4><textarea class="notes" id="notes" placeholder="记下用途、环境要求，或下一次想做的事…">${esc(prefs.notes[id]||'')}</textarea><button class="btn primary" id="save-note">保存备注</button><p class="notice">命令供复制后在终端执行，页面不会启动服务。</p>`;$('drawer').classList.remove('hidden');$('overlay').classList.remove('hidden');document.body.classList.add('modal-open');$('close').focus()}
function close(){activeId=null;$('drawer').classList.add('hidden');$('overlay').classList.add('hidden');document.body.classList.remove('modal-open');lastFocus?.focus()}
function download(file,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validate(d){if(d?.schemaVersion!==1||!Array.isArray(d.projects)||!Array.isArray(d.duplicates)||!Array.isArray(d.workflows)||!d.coverage||!Array.isArray(d.coverage.roots)||!Array.isArray(d.coverage.errors))throw Error('格式不符合清单规范');const ids=new Set();for(const p of d.projects){if(!p||typeof p.id!=='string'||ids.has(p.id)||!['name','path','repo','description','modified','commit','branch','version'].every(k=>typeof p[k]==='string')||!['aliases','stack','uses','commands'].every(k=>Array.isArray(p[k])))throw Error('项目字段不完整');ids.add(p.id);for(const c of p.commands)if(!c||typeof c.command!=='string')throw Error('启动命令格式错误')}for(const g of d.duplicates)if(!Array.isArray(g.ids)||!g.ids.every(id=>ids.has(id)))throw Error('副本关联无效');for(const w of d.workflows)if(!Array.isArray(w.steps)||!w.steps.every(s=>Array.isArray(s.ids)&&s.ids.every(id=>ids.has(id))))throw Error('工作流关联无效');return d}
$('search').oninput=()=>{page=0;render()};$('category').onchange=$('sort').onchange=()=>{page=0;render()};$('cards').onclick=()=>{layout='cards';$('cards').classList.add('active');$('rows').classList.remove('active');render()};$('rows').onclick=()=>{layout='rows';$('rows').classList.add('active');$('cards').classList.remove('active');render()};$('hero-flow').onclick=()=>setView('workflows');$('overlay').onclick=close;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)setView(b.dataset.view);if(b.dataset.open)openProject(b.dataset.open);if(b.dataset.star){const id=b.dataset.star;prefs.favorites=prefs.favorites.includes(id)?prefs.favorites.filter(x=>x!==id):[...prefs.favorites,id];save();render()}if(b.id==='close')close();if(b.id==='copy-path')copy(get(activeId).path);if(b.hasAttribute('data-copy-command'))copy(get(activeId).commands[Number(b.dataset.copyCommand)].command);if(b.id==='save-note'){prefs.notes[activeId]=$('notes').value;save();toast('备注已保存')}if(b.id==='prev'){page--;render()}if(b.id==='next'){page++;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('search').focus()}if(e.key==='Tab'&&activeId){const els=[...$('drawer').querySelectorAll('button,a,textarea')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
$('export-json').onclick=()=>download('工具工作室.json',JSON.stringify({...data,preferences:prefs},null,2),'application/json');$('export-md').onclick=()=>{const lines=['# 我的工具工作室','',`更新：${data.generatedAt}`,''];for(const p of data.projects){lines.push('## '+name(p),'',p.description,'',`- 位置：${p.path}`,`- 仓库：${p.repo||'本地项目'}`,`- 版本：${p.version||'未声明'} / ${p.commit||'未记录'}`,'');for(const c of p.commands)lines.push('### '+c.label,'',c.kind+' · '+c.source,'','```sh',c.command,'```','');lines.push(...p.uses.map(u=>'- '+u));if(prefs.notes[p.id])lines.push('备注：'+prefs.notes[p.id]);lines.push('')}for(const w of data.workflows){lines.push('## 工作流：'+w.title,'',w.description||'',w.status||'',...w.steps.map((s,i)=>(i+1)+'. '+s.title+'：'+(s.description||'')),'',w.evidence||'','')}for(const g of data.duplicates){lines.push('## 副本：'+g.name,'',g.comparison,...g.ids.map(id=>'- '+get(id).path),'')}download('工具工作室.md',lines.join('\n'),'text/markdown')};$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('文件超过 20 MB');const d=validate(JSON.parse(await f.text()));if(d.preferences&&Array.isArray(d.preferences.favorites)&&d.preferences.notes&&typeof d.preferences.notes==='object'){prefs.favorites=[...new Set([...prefs.favorites,...d.preferences.favorites])];prefs.notes={...d.preferences.notes,...prefs.notes};save()}data=d;close();page=0;init();toast('清单已更新，备注已保留')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}};
init();
</script></body></html>
